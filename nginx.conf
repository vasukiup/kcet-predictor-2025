events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Enable Gzip Compression for Static & API responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Redirect all HTTP (port 80) traffic to HTTPS (port 443)
    server {
        listen 80;
        server_name kcet-predictor.local;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server Block (SSL Enabled)
    server {
        listen 443 ssl;
        server_name kcet-predictor.local;

        # SSL Certificates Paths
        ssl_certificate     /etc/nginx/certs/kcet-predictor.local.crt;
        ssl_certificate_key /etc/nginx/certs/kcet-predictor.local.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Web socket support for reloading
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
