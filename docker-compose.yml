services:
  db:
    image: postgres:15-alpine
    container_name: kcet-db
    restart: always
    environment:
      POSTGRES_DB: kcet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: kcet-web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=kcet
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - PORTAL_USERNAME=admin
      - PORTAL_PASSWORD=kcet2025
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: kcet-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web

volumes:
  postgres_data:
